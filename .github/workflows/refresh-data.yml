name: Refresh football data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
      - 'scripts/update-data.mjs'
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch fixtures and calculate estimates
        run: node scripts/update-data.mjs
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || (git commit -m "Refresh football fixtures and estimates" && git push)
