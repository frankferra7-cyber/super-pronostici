<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<title>Super Pronostici</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f30;--line:#23384b;--muted:#91a4b8;--text:#f3f7fb;--green:#a3ff35;--green2:#d1ff9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
header{max-width:1100px;margin:auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.ball{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#b8ff65,#58c927);display:grid;place-items:center;color:#081321;font-size:29px}
main{max-width:1100px;margin:auto;padding:8px 20px 40px}
nav{display:flex;gap:8px;overflow:auto;padding:8px 0 18px}nav button{white-space:nowrap;background:var(--panel);color:#c6d4e1;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer}nav button.active{background:var(--green);border-color:var(--green);color:#091421}
.card{background:linear-gradient(155deg,#14283a,#0e1b2a);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:10px}
.empty{text-align:center;padding:30px;color:var(--muted)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<section id="authGate" style="max-width:460px;margin:8vh auto;padding:26px;background:#101f30;border:1px solid #23384b;border-radius:18px;color:#f3f7fb">
<div style="font-size:26px">⚽ <b>SUPER PRONOSTICI</b></div>
<h2 id="authTitle">Accedi</h2>
<p id="authMessage" style="color:#91a4b8">Inserisci le tue credenziali.</p>
<form id="authForm" style="display:grid;gap:10px">
<input id="authEmail" type="email" required placeholder="Email" style="padding:13px;border-radius:10px;border:1px solid #385168;background:#07111f;color:white">
<input id="authPassword" type="password" required minlength="8" placeholder="Password" style="padding:13px;border-radius:10px;border:1px solid #385168;background:#07111f;color:white">
<button type="submit" id="authSubmit" style="padding:13px;border:0;border-radius:10px;background:#a3ff35;color:#081321;font-weight:800;cursor:pointer">Accedi</button>
</form>
<button id="authLogout" type="button" style="display:none;margin-top:12px;padding:10px;background:#ef4444;color:white;border:0;border-radius:8px;cursor:pointer">Esci</button>
</section>

<header id="appHeader" style="display:none"><div class="brand"><div class="ball">⚽</div><div><strong>SUPER PRONOSTICI</strong></div></div><button id="appLogout" type="button" style="padding:7px 11px;border-radius:99px;background:#14283a;color:#dce8f2;border:1px solid #315044;cursor:pointer">Esci</button></header>

<main id="appMain" style="display:none">
<nav><button class="active" data-tab="oggi">⚡ Oggi</button></nav>
<section><h2 id="sectionTitle">Partite</h2><div id="content" class="grid"><div class="card empty">Caricamento in corso...</div></div></section>
</main>

<script>
const SUPABASE_URL="https://exphhqunlvlyzjvrxdla.supabase.co";
const SUPABASE_KEY="sb_publishable_ogiqcvuNnOjlqT5ADuqpAg_-KTAEiuz";
const authClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showApp(user){
  document.getElementById('authGate').style.display='none';
  document.getElementById('appHeader').style.display='flex';
  document.getElementById('appMain').style.display='block';
  document.getElementById('content').innerHTML='<div class="card">Benvenuto, <b>'+user.email+'</b>! Accesso riuscito con successo.</div>';
}

document.getElementById('authForm').onsubmit=async e=>{
  e.preventDefault();
  const email=document.getElementById('authEmail').value.trim().toLowerCase();
  const password=document.getElementById('authPassword').value;
  const msg=document.getElementById('authMessage');
  const btn=document.getElementById('authSubmit');
  
  msg.style.color="#91a4b8";
  msg.textContent="Verifica in corso...";
  btn.disabled=true;

  try {
    const {data, error} = await authClient.auth.signInWithPassword({email, password});
    if (error) throw error;
    if (data.session) {
      showApp(data.session.user);
    }
  } catch (err) {
    console.error("Errore login:", err);
    msg.style.color="#ef4444";
    msg.textContent="Errore: " + (err.message || "Credenziali non valide o errore di rete.");
  } finally {
    btn.disabled=false;
  }
};

const handleLogout = () => authClient.auth.signOut().then(() => location.reload());
document.getElementById('authLogout').onclick = handleLogout;
document.getElementById('appLogout').onclick = handleLogout;

// Controlla se c'è già una sessione attiva
authClient.auth.getSession().then(({data}) => {
  if (data.session) showApp(data.session.user);
});
</script>
</body>
</html>
